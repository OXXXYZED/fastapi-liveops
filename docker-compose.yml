services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liveops
      POSTGRES_PASSWORD: liveops
      POSTGRES_DB: liveops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveops"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  server:
    build: .
    environment:
      LIVEOPS_DATABASE_URL: postgresql+asyncpg://liveops:liveops@postgres:5432/liveops
      LIVEOPS_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
